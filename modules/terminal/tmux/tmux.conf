set -sg escape-time 10

%if "#{==:#{env:XDG_CONFIG_HOME},}"
set-environment -g DOTFILES_TMUX_CONFIG "$HOME/.config/tmux"
%else
set-environment -g DOTFILES_TMUX_CONFIG "$XDG_CONFIG_HOME/tmux"
%endif

# Let tmux receive wheel events for pane-history scrolling.
set -g mouse on

# Keep trackpad wheel events over the status bar from switching windows.
unbind-key -T root WheelUpStatus
unbind-key -T root WheelDownStatus

# Wheel up in a regular pane enters scrollback mode, then moves immediately.
# In Vim/fzf/etc. or copy-mode, pass the wheel event through normally.
bind-key -T root WheelUpPane if-shell -F '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -e; send-keys -X -N 5 scroll-up'

# With mouse reporting on, the terminal cannot do native drag selection. Let
# tmux own plain pane drags and copy the selection directly to macOS on release.
bind-key -T root MouseDrag1Pane if-shell -F '#{||:#{alternate_on},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -M'
bind-key -T copy-mode MouseDrag1Pane select-pane \; send-keys -X begin-selection
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi MouseDrag1Pane select-pane \; send-keys -X begin-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'

# Copy-mode Enter/y should copy to the macOS clipboard.
set -s copy-command 'pbcopy'
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

set -g history-limit 50000

set -g display-time 4000

set -g status-interval 5

set -gq allow-passthrough off
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g base-index 0
set -g pane-base-index 0
set -g renumber-windows on

setw -g automatic-rename on
set -g set-titles on

bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded!"

unbind-key '"'
unbind-key %
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

bind-key c new-window -c "#{pane_current_path}"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

bind-key -r p previous-window
bind-key -r n next-window

bind-key -n M-h previous-window
bind-key -n M-l next-window

bind-key -r "<" swap-window -d -t -1
bind-key -r ">" swap-window -d -t +1

bind-key S setw synchronize-panes \; display-message "Synchronize panes toggled!"

bind-key -r C-p select-pane -t :.+

bind-key -n M-1 select-window -t 0
bind-key -n M-2 select-window -t 1
bind-key -n M-3 select-window -t 2
bind-key -n M-4 select-window -t 3
bind-key -n M-5 select-window -t 4
bind-key -n M-6 select-window -t 5
bind-key -n M-7 select-window -t 6
bind-key -n M-8 select-window -t 7
bind-key -n M-9 select-window -t 8
bind-key -n M-0 select-window -t 9

# Keep pane-navigation keys unambiguous; Meta variants handle pane joining.
bind-key M-j choose-window 'join-pane -h -s "%%"'
bind-key M-w choose-window 'join-pane -h -t "%%"'

bind-key C-l send-keys 'C-l' \; run-shell 'sleep 0.1' \; clear-history

set -g status-position top

set -g @rose_pine_variant 'dawn'
set -g @rose_pine_host 'off'
set -g @rose_pine_user 'on'
set -g @rose_pine_directory 'off'
set -g @rose_pine_date_time '%I:%M %p'
set -g @rose_pine_show_current_program 'off'
set -g @rose_pine_show_pane_directory 'off'

set -g status-right-length 150

set -g @rose_pine_left_separator ' '
set -g @rose_pine_right_separator ' '
set -g @rose_pine_field_separator ' · '
set -g @rose_pine_window_separator '  '

set -g @rose_pine_session_icon ''
set -g @rose_pine_current_window_icon '●'
set -g @rose_pine_folder_icon ''
set -g @rose_pine_username_icon ''
set -g @rose_pine_hostname_icon ''
set -g @rose_pine_date_time_icon ''
set -g @rose_pine_window_status_separator "  "

set -g @rose_pine_width_to_hide '80'
set -g @rose_pine_window_count '5'

set -g @rose_pine_bar_bg_disable 'off'

bind-key -r ( switch-client -p
bind-key -r ) switch-client -n

bind-key C-s new-session
bind-key N command-prompt -p "New session name:" "new-session -s '%%'"

bind-key X confirm-before -p "kill-session? (y/n)" kill-session

bind-key s choose-tree -Zs

bind-key '$' command-prompt -I "#S" "rename-session '%%'"

bind-key d detach-client
bind-key D choose-client -Z

bind-key BTab switch-client -l

bind-key -r f run-shell "tmux neww '#{E:DOTFILES_TMUX_CONFIG}/scripts/tmux-sessionizer'"

# Keep TPM/plugin path stable while using XDG tmux.conf.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'rose-pine/tmux'
# Keep continuum last so theme plugins don't clobber its status-right hook.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Exclude sensitive processes from resurrect
set -g @resurrect-processes '!ssh !gpg !pass'

run-shell '~/.tmux/plugins/tpm/tpm'

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'send-keys -R C-l'

# Override left status to show icon before session name
set -g status-left " #{@rose_pine_session_icon} #S  "
