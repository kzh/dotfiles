# Initial preferences for new installs. Existing Atuin configs are preserved.
# Colors follow the terminal's palette; no custom theme is forced.
search_mode = "fuzzy"
filter_mode = "global"

style = "full"
inline_height = 0
invert = true
show_preview = false
show_help = false
show_tabs = false

enter_accept = false
exit_mode = "return-query"
